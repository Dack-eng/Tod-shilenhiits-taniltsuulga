  <path d="M250 250L390 520L530 250" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M220 540C300 590 490 590 580 540" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="560" cy="230" r="38" fill="rgba(255,255,255,0.14)"/>

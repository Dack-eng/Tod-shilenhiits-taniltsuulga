<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Black mirror</title>
  <desc id="desc">Black framed minimalist mirror</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1b1d"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#4d4d4d"/>
      <stop offset="50%" stop-color="#18191b"/>
      <stop offset="100%" stop-color="#5a5a5d"/>
